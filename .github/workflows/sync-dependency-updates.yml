name: Sync dependency branch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-dependency-updates
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge current main into dependency-updates
        shell: bash
        run: |
          # Merge against the current server tip, preserving concurrent dependency commits.
          # A conflict fails the job without resetting or overwriting either branch.
          gh api --method POST "repos/$GH_REPO/merges" \
            -f base=dependency-updates -f head=main \
            -f commit_message=$'[Agent] Sync main into dependency-updates\n\nAgent-Originated: true\nAgent: GitHub Actions'

      # GITHUB_TOKEN updates do not trigger push workflows; dispatch CI explicitly.
      - name: Validate dependency branch
        run: |
          gh workflow run build.yml --ref dependency-updates
          gh workflow run codeql.yml --ref dependency-updates
