name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dependency-updates" ]
  pull_request:
    branches: [ "main", "dependency-updates" ]

permissions:
  contents: read

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify publication helpers offline
        run: python3 -m unittest discover -s tooling/central -p 'test_*.py'

      - name: Build with Gradle Wrapper
        run: ./gradlew test ktlintCheck build coverageReport --no-daemon --stacktrace

  windows-filesystem:
    name: Windows filesystem
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: jdk17
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-java@v6
        id: jdk25
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Verify log ownership and terminal asset cleanup
        shell: pwsh
        run: >-
          .\gradlew.bat :adapters:logback:test :adapters:logback:ktlintCheck --max-workers=2
          :platforms:terminal:test :platforms:terminal:ktlintCheck
          "-Dorg.gradle.java.installations.paths=${{ steps.jdk17.outputs.path }},${{ steps.jdk25.outputs.path }}"

  dependency-submission:
    name: Dependency submission
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.3.0
